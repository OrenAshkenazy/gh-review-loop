name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        # Ruff 0.16 enables new checks that require a dedicated repository-wide
        # migration. Keep CI reproducible at the last known-green release.
        run: python -m pip install --upgrade pip pytest ruff==0.15.20
      - name: Lint (ruff)
        run: ruff check plugins/ tests/
      - name: Compile scripts
        shell: bash
        run: |
          python -m py_compile plugins/gh-review-loop/skills/gh-review-loop/scripts/*.py
          python -m py_compile plugins/glg-questionnaire/skills/glg-questionnaire/scripts/*.py
      - name: Validate plugin packaging
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("plugins/gh-review-loop")
          claude = json.loads((root / ".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          codex = json.loads((root / ".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          marketplace = json.loads(Path(".agents/plugins/marketplace.json").read_text(encoding="utf-8"))
          catalog = json.loads(Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          hooks = json.loads((root / "hooks/hooks.json").read_text(encoding="utf-8"))

          assert claude["name"] == codex["name"] == "gh-review-loop"
          assert claude["version"] == codex["version"]

          # Storefront metadata must not drift between the runtimes: these strings
          # are what users see in the plugin picker and the marketplace listing.
          display = "GH Review Loop"
          assert claude["displayName"] == display
          assert codex["interface"]["displayName"] == display
          assert marketplace["interface"]["displayName"] == display
          assert catalog["plugins"][0]["displayName"] == display
          assert claude["description"] == codex["description"]
          assert catalog["plugins"][0]["description"].startswith(claude["description"])
          assert claude["keywords"] == codex["keywords"]
          assert codex["skills"] == "./skills/"
          assert (root / "skills/gh-review-loop/SKILL.md").exists()
          assert (root / "hooks/hooks.json").exists()
          assert "hooks" in hooks and "PreToolUse" in hooks["hooks"] and "Stop" in hooks["hooks"]
          assert marketplace["plugins"][0]["name"] == "gh-review-loop"
          assert marketplace["plugins"][0]["source"] == {
              "source": "local",
              "path": "./plugins/gh-review-loop",
          }

          # Second plugin: glg-questionnaire. Same drift guards, no hooks.
          glg = Path("plugins/glg-questionnaire")
          glg_claude = json.loads((glg / ".claude-plugin/plugin.json").read_text())
          glg_codex = json.loads((glg / ".codex-plugin/plugin.json").read_text())
          assert glg_claude["name"] == glg_codex["name"] == "glg-questionnaire"
          assert glg_claude["version"] == glg_codex["version"]
          assert glg_claude["description"] == glg_codex["description"]
          assert glg_codex["skills"] == "./skills/"
          assert (glg / "skills/glg-questionnaire/SKILL.md").exists()
          by_name = {p["name"]: p for p in catalog["plugins"]}
          assert by_name["glg-questionnaire"]["source"] == "./plugins/glg-questionnaire"
          assert by_name["glg-questionnaire"]["description"] == glg_claude["description"]
          mirror = {p["name"]: p for p in marketplace["plugins"]}
          assert mirror["glg-questionnaire"]["source"] == {
              "source": "local",
              "path": "./plugins/glg-questionnaire",
          }
          PY
      - name: Pytest
        run: pytest tests/ -v
